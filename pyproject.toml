[build-system]
build-backend = "setuptools.build_meta"
requires = ["babel>2.8", "setuptools>=61", "wheel"]

[project]
name = "invenio-modular-detail-page"
version = "0.3.1-dev1"

description = "InvenioRDM extension that adds a modular record detail page"
readme = "README.md"
keywords = ["invenio", "modular", "ui"]

license = { file = "LICENSE" }
authors = [{ name = "MESH Research", email = "scottia4@msu.edu" }]
requires-python = ">=3.12"

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["invenio-app-rdm<14"]

optional-dependencies.dev = [
  "bumpver",
  "check-manifest",
  "ipykernel",
  "pip-tools",
]
optional-dependencies.test = [
  "mypy>=1.8",
  "pytest-cov>=6.2.1",
  "pytest-invenio>=3.3,<4",
  "pytest-isort>=4",
  "pytest-mock",
  "pytest-mypy>=0.10",
  "pytest-ruff>=0.1",
  "requests-mock",
  "ruff>=0.3",
  "selenium",
]

urls.Homepage = "https://github.com/MESH-Research/invenio-modular-detail-page"

entry-points."invenio_assets.webpack".invenio_modular_detail_page_theme = "invenio_modular_detail_page.webpack:theme"
entry-points."invenio_base.apps".invenio_modular_detail_page = "invenio_modular_detail_page:InvenioModularDetailPage"
entry-points."invenio_base.blueprints".invenio_modular_detail_page = "invenio_modular_detail_page.ext:create_blueprint"
entry-points."invenio_i18n.translations".messages = "invenio_modular_detail_page"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
  "**/*.ipynb",    # Exclude Jupyter notebook files
  "app_data",
  "docs",
  "node_modules",
  "scripts",
  "tests/helpers",
]
# temporarily removed C for complexity checks
lint.select = ["B", "D", "DOC", "E", "F", "I", "UP"]
# Now Ruff handles formatting, so enable formatting rules
lint.ignore = [
  "D412", # Missing blank line before closing docstring
  # Keep some warnings disabled
  "W1", # Indentation warnings
  "W2", # Whitespace warnings
  "W3", # Blank line warnings
]
lint.per-file-ignores."__init__.py" = ["D104", "E402", "F401"]
# Ensure consistent import sorting - explicitly declare tests as first-party
lint.isort.known-first-party = [
  "invenio_stats_dashboard",
  "invenio_record_importer_kcworks",
  "tests",
]
lint.pydocstyle.convention = "google"
lint.preview = true

[tool.isort]
profile = "black"
line_length = 88
verbose = true
multi_line_output = 3 # Vertical hanging indent
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
split_on_trailing_comma = true
skip = [
  "__pycache__", # Skip cache directories
  # ".venv",  # Skip virtual environment
  # "node_modules",  # Skip node modules
]

[tool.check-manifest]
ignore = [
  "PKG-INFO",
  ".egg-info",
  ".egg-info/*",
  "setup.cfg",
  ".DS_Store",
  ".hgtags",
  ".hgsigs",
  ".hgignore",
  ".gitignore",
  ".bzrignore",
  ".gitattributes",
  ".github/*",
  "* .mo",
  "dist/*",
  "build/*",
  "invenio_modular_detail_page/dependencies/*",
]

[tool.pytest.ini_options]
addopts = """
--ruff --doctest-modules
--log-cli-level=DEBUG
--ignore=app_data
--ignore=docs
--ignore=node_modules
--ignore=scripts
--ignore=tests/helpers
--cov=invenio_modular_detail_page 
--cov-report=term-missing
"""
norecursedirs = []
log_cli_level = "DEBUG"
isort_show_files = true
plugins = []
testpaths = ["docs", "tests", "invenio_modular_detail_page"]

[tool.coverage.run]
omit = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = false
ignore_missing_imports = true
follow_imports = "skip"
allow_untyped_globals = true
exclude = ['^tests/']

[tool.sphinx]
source-dir = "docs/"
build-dir = "docs/_build"
all_files = true

[tool.babel.compile_catalog]
directory = "invenio_modular_detail_page/translations/"
use-fuzzy = true

[tool.babel.extract_messages]
copyright_holder = "MESH Research"
msgid_bugs_address = "scottia4@msu.edu"
mapping-file = "babel.ini"
output-file = "invenio_modular_detail_page/translations/messages.pot"
add-comments = "NOTE"

[tool.babel.init_catalog]
input-file = "invenio_modular_detail_page/translations/messages.pot"
output-dir = "invenio_modular_detail_page/translations/"

[tool.babel.update_catalog]
input-file = "invenio_modular_detail_page/translations/messages.pot"
output-dir = "invenio_modular_detail_page/translations/"

[tool.bumpver]
current_version = "0.3.1-dev1"
version_pattern = "MAJOR.MINOR.PATCH[-TAGNUM]"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['^version = "{version}"', '^current_version = "{version}"']
"README.md" = ['^Version {version}']
"VERSION" = ['^"{version}"']
"invenio_modular_detail_page/__init__.py" = ['^__version__ = "{version}"']
